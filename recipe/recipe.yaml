# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.4"
  python_check_max: "3.14"

package:
  name: skrebate
  # the epoch is due to a historic issue with yanked upstream releases of 0.61 and 0.62
  version: 1!${{ version }}

source:
  url: https://pypi.org/packages/source/s/skrebate/skrebate-${{ version }}.tar.gz
  sha256: 4b590dfbc64ab5f6d6b215a07a472a7e8f8990f395f37bde33fe171b852b449b

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . --no-deps -vv --no-build-isolation --disable-pip-version-check --check-build-dependencies

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=61
    - wheel
  run:
    - joblib
    - numpy
    - python >=${{ python_min }}
    - scikit-learn
    - scipy

tests:
  - package_contents:
      strict: true
      files:
        - etc/conda/test-files/skrebate/**
      site_packages:
        - skrebate/**
        - skrebate-${{ version }}.dist-info/**
  - python:
      imports: skrebate
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - tests/
    requirements:
      run:
        - pytest-cov
        - pandas
    script:
      - coverage run --source=skrebate --branch -m pytest -vv --tb=long --color=yes
      - coverage report --show-missing --skip-covered --fail-under=100

about:
  license: MIT
  license_file: LICENSE
  summary: |
    Feature selection algorithms based on Relief-based methods
  homepage: https://pypi.org/project/skrebate
  repository: https://github.com/UrbsLab/scikit-rebate
  documentation: https://urbslab.github.io/scikit-rebate

extra:
  recipe-maintainers:
    - bollwyvl
    - lacava
    - rhiever
    - weixuanfu
